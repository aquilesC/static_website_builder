# pyproject.toml

[build-system]
requires = ["setuptools>=75.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqui_brain_dump"
version = "1.4.0"
description = "Compile a set of notes into a browseable website"
readme = "README.md"
authors = [{ name = "Aquiles Carattino", email = "aqui.carattino@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["feed", "reader", "tutorial"]
dependencies = [
    'beautifulsoup4>=4.13.4',
    'Jinja2>=3.1.6',
    'Markdown>=3.8.2',
    'markdown-checklist>=0.4.4',
    'MarkupSafe>=3.0.2',
    'networkx>=3.5',
    'numpy>=2.3.2',
    'python-frontmatter>=1.1.0',
    'PyYAML>=6.0.2',
    'requests>=2.28.0',
    'soupsieve>=2.7',
    'typing_extensions>=4.14.1',
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/aquilesC/static_website_builder"

[project.scripts]
brain_dump = "aqui_brain_dump.__main__:main"
garden_tools = "aqui_brain_dump.garden_tools:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aqui_brain_dump*"]

[tool.setuptools.package-data]
"aqui_brain_dump" = ["sitemap.xml", "feed.rss"]

[tool.setuptools]
license-files = []